# ==============================================================================
# Gaming Performance & Kernel Latency Tuning
# ==============================================================================

# Memory map count: Critical for Wine/Proton games, UE5 titles, and Star Citizen
# Prevents memory allocation crashes
vm.max_map_count = 2147483642

# Prevent micro-stutters in Wine / Proton games caused by split-lock bus locking
kernel.split_lock_mitigate = 0

# Virtual Memory & Swapping Tuning
# Reduce aggressive swapping to disk when using ZRAM
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Network Latency Optimizations for Online Gaming
net.core.default_qdisc = fq_pie
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3

# File system inotify watch limits for large game libraries
fs.inotify.max_user_watches = 524288
fs.file-max = 2097152

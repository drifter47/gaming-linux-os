# ==============================================================================
# Calamares Partitioning Configuration - Btrfs + ZSTD Layout
# ==============================================================================
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawPartitionLabels: true
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@var_log
    - mountPoint: /var/cache
      subvolume: /@var_cache

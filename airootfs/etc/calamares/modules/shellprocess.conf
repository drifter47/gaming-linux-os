# ==============================================================================
# Calamares Shellprocess Post-Install Module
# ==============================================================================
dontChroot: false
timeout: 300
script:
  # Enable Essential Gaming & System Daemons
  - "systemctl enable NetworkManager.service"
  - "systemctl enable bluetooth.service"
  - "systemctl enable sddm.service"
  - "systemctl enable gamemoded.service"
  - "systemctl enable switcheroo-control.service"
  - "systemctl enable systemd-zram-setup@zram0.service"
  
  # Configure Btrfs Snapper automatic snapshot rollback
  - "/usr/bin/snapper --no-dbus -c root create-config / || true"
  - "/usr/bin/chmod 750 /.snapshots || true"
  
  # Regenerate Initial Ramdisk and GRUB configuration
  - "/usr/bin/mkinitcpio -P"
  - "/usr/bin/grub-mkconfig -o /boot/grub/grub.cfg"

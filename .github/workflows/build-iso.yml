name: Build Gaming OS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: true
        type: boolean
        default: true

jobs:
  build-iso:
    name: Build & Package ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Build ISO using Docker
        run: |
          mkdir -p out
          docker build -t gaming-os-builder -f Dockerfile .
          docker run --rm --privileged -v $(pwd)/out:/build/out gaming-os-builder

      - name: Generate Checksums
        run: |
          cd out
          sha256sum gaming-os-*.iso > sha256sum.txt
          cat sha256sum.txt

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaming-os-iso
          path: out/*
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/sha256sum.txt
          tag_name: ${{ github.ref_name || 'latest' }}
          name: "Gaming OS Release ${{ github.ref_name || 'Automated Build' }}"
          body: |
            ## Gaming OS ISO Build
            - **Base**: Arch Linux (archiso)
            - **Kernel**: linux-zen (Fsync, Futex2, BORE scheduling)
            - **Desktop**: KDE Plasma 6 (Wayland + HDR/VRR support)
            - **Drivers**: Universal Mesa (RADV/ANV) + NVIDIA DKMS Explicit Sync
            - **Installer**: Calamares with Btrfs & Snapper rollback snapshots
            - **Launchers**: Steam, Heroic, Lutris, ProtonUp-Qt, MangoHud, GameMode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

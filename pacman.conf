#
# /etc/pacman.conf - Gaming OS Build Configuration
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Output options
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Standard Arch Repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Multilib is mandatory for 32-bit Wine, Steam, and legacy game binaries
[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR for pre-built gaming binaries (Heroic, MangoHud, ProtonUp-Qt, Calamares)
[chaotic-aur]
SigLevel = Never
Server = https://geo-mirror.chaotic.cx/$repo/$arch
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
